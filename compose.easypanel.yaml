services:
  app:
    extends:
      file: compose.production.yaml
      service: app
    environment:
      DAG_PUBLIC_URL: ${DAG_PUBLIC_URL:-https://dag.eclud.com.br}
    networks:
      default:
      postgres_private:

  scheduler:
    extends:
      file: compose.production.yaml
      service: scheduler
    environment:
      DAG_PUBLIC_URL: ${DAG_PUBLIC_URL:-https://dag.eclud.com.br}
    networks:
      default:
      postgres_private:

volumes:
  evidence_data:

networks:
  postgres_private:
    external: true
    name: ${DAG_POSTGRES_NETWORK:-easypanel-promovilas-prod}
