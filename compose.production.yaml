x-dag-runtime: &dag-runtime
  build: .
  env_file: .env
  restart: unless-stopped
  volumes:
    - evidence_data:/var/www/html/storage/app/private

services:
  app:
    <<: *dag-runtime
    environment:
      DAG_TRUST_PROXY: "true"

  scheduler:
    <<: *dag-runtime
    user: www-data
    command: ["php", "artisan", "schedule:work"]

volumes:
  evidence_data:
